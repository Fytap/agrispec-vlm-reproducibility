experiment:
  id: P2_WEEDSGALORE_OFFICIAL_SPATIAL_DINOV2_FINETUNE_20260810_v1
  stage: SAT major-revision development
  public_data_only: true
  sealed_test_read: false
  physical_gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
split: {fit: official_train, epoch_selection: official_validation, score_once: official_test}
sampling:
  source: prospective DINOv2 coreset IDs from official spatial queue v2
  labels_per_repeat: 300
  repeats: 10
  paired_frozen_comparison: same selected IDs
model:
  identifier: vit_small_patch14_dinov2.lvd142m
  crop: tight_candidate_bbox_without_padding
  trainable: [last_transformer_block, final_norm, binary_head]
training:
  epochs: 8
  batch_size: 64
  optimizer: AdamW
  learning_rate_last_block_and_norm: 0.00001
  learning_rate_head: 0.001
  weight_decay: 0.0001
  loss: class_weighted_binary_cross_entropy
  augmentations: [random_horizontal_flip, random_vertical_flip]
  validation_choice: [maximum_AUROC, maximum_AP, earlier_epoch]
queue: {k: [1, 5, 10, 20, 50], tie_break: candidate_id_lexical_ascending}
