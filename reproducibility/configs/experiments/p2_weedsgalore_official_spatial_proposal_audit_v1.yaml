experiment:
  id: P2_WEEDSGALORE_OFFICIAL_SPATIAL_PROPOSAL_AUDIT_20260810_v1
  stage: SAT major-revision development
  public_data_only: true
  sealed_test_read: false
  compute: CPU-only
split:
  source: official WeedsGalore train/val/test text files
  counts: {train: 104, val: 26, test: 26}
  setting_selection_role: train only
proposal_selection:
  objective: maximize training-split role-qualified weed-instance proposal recall
  maximum_candidates_per_image: 100
  tie_break:
    - lower candidate burden
    - higher foreground threshold
    - larger minimum component area
matching:
  primary_instance_coverage: 0.50
  primary_candidate_labeled_coverage: 0.50
  primary_same_role_purity: 0.90
  split_merge_sensitivity: [0.10, 0.25, 0.50]
  iou_sensitivity: [0.25, 0.50, 0.75]
reporting:
  preserve_failures: true
  retain_raw_numerators_denominators: true
  date_strata_within_split: true
